name: Pipeline CI/CD C14

# Define quando a pipeline vai rodar (ao fazer push para a main)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ---------------------------------------------------
  # JOB 1: Instalação de dependências e Build
  # ---------------------------------------------------
  build:
    name: 1. Build do Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      
      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Compilar o código fonte
        run: chmod +x mvnw && ./mvnw clean compile

  # ---------------------------------------------------
  # JOB 2: Execução de Testes
  # ---------------------------------------------------
  test:
    name: 2. Execução de Testes
    runs-on: ubuntu-latest
    needs: build # Só roda se o build der certo
    
    # Subimos o banco de dados temporário para os testes não quebrarem
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: finance_crypto_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Rodar a suíte de testes unitários
        run: chmod +x mvnw && ./mvnw test

  # ---------------------------------------------------
  # JOB 3: Empacotamento / Geração de Artefato
  # ---------------------------------------------------
  package:
    name: 3. Geração de Artefatos
    runs-on: ubuntu-latest
    needs: test # Só roda se os testes passarem verdes
    steps:
      - uses: actions/checkout@v4
      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Empacotar a aplicação (.jar)
        run: chmod +x mvnw && ./mvnw package -DskipTests
        
      - name: Fazer upload do artefato gerado
        uses: actions/upload-artifact@v4
        with:
          name: finance-crypto-app
          path: target/*.jar

  # ---------------------------------------------------
  # JOB 4: Simulação de Deploy
  # ---------------------------------------------------
  deploy-simulado:
    name: 4. Simulação de Deploy
    runs-on: ubuntu-latest
    needs: package # Só roda se o artefato foi gerado com sucesso
    steps:
      - name: Baixar o artefato do job anterior
        uses: actions/download-artifact@v4
        with:
          name: finance-crypto-app
          
      - name: Simular Deploy em Produção
        run: |
          echo "🚀 Iniciando simulação de deploy..."
          echo "Baixando o artefato .jar para o servidor..."
          ls -la
          echo "✅ Deploy simulado com sucesso no ambiente de Produção!"